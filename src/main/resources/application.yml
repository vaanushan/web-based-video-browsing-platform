server:
  port: 8080

spring:
  application:
    name: video-browsing-system

  datasource:
    url: jdbc:mysql://localhost:3306/video_browsing_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root      # <-- put your real MySQL root password here
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

app:
  jwt:
    secret: CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_BEFORE_PRODUCTION
    expiration-ms: 86400000

aws:
  s3:
    bucket-name: video-browsing-system-storage
    region: ap-south-1
    access-key: YOUR_AWS_ACCESS_KEY
    secret-key: YOUR_AWS_SECRET_KEY