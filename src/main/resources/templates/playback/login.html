<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Sign in — VideoHub</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<nav th:replace="~{fragments/layout :: nav(active='login')}"></nav>

<div class="auth-wrap">
  <h1 style="text-align:center; font-size:1.8rem;">Welcome back</h1>
  <p style="text-align:center;">Sign in to pick up where you left off.</p>

  <div class="auth-card">
    <form th:action="@{/login}" method="post">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required/>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required/>
      </div>
      <p th:if="${error}" style="color: var(--coral); font-size: 0.85rem;" th:text="${error}">Incorrect email or password.</p>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Sign in</button>
    </form>
    <p class="switch">New here? <a th:href="@{/register}">Create an account</a></p>
    <p class="switch" style="margin-top:10px;"><a th:href="@{/admin/login}">Admin sign in &rarr;</a></p>
  </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
