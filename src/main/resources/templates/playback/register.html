<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Create account — VideoHub</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<nav th:replace="~{fragments/layout :: nav(active='register')}"></nav>

<div class="auth-wrap">
  <h1 style="text-align:center; font-size:1.8rem;">Join VideoHub</h1>
  <p style="text-align:center;">Create an account to subscribe, save videos, and build playlists.</p>

  <div class="auth-card">
    <form th:action="@{/register}" method="post">
      <div class="field">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" placeholder="Your name" required/>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required/>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="At least 8 characters" required minlength="8"/>
      </div>
      <p th:if="${error}" style="color: var(--coral); font-size: 0.85rem;" th:text="${error}">That email is already registered.</p>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Create account</button>
    </form>
    <p class="switch">Already have an account? <a th:href="@{/login}">Sign in</a></p>
  </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
