<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Admin sign in — VideoHub</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div class="auth-wrap">
  <h1 style="text-align:center; font-size:1.8rem;">Admin sign in</h1>
  <p style="text-align:center;">Sign in to manage users, videos, and platform settings.</p>

  <div class="auth-card">
    <form th:action="@{/admin/login}" method="post">
      <div class="field">
        <label for="email">Admin email</label>
        <input id="email" name="email" type="email" placeholder="admin@videohub.com" required/>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required/>
      </div>
      <p th:if="${error}" style="color: var(--coral); font-size: 0.85rem;" th:text="${error}">Incorrect email or password.</p>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Sign in as admin</button>
    </form>
    <p class="switch"><a th:href="@{/}">&larr; Back to VideoHub</a> &middot; <a th:href="@{/login}">User sign in</a></p>
  </div>
</div>

</body>
</html>
