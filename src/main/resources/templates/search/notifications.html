<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Notifications — VideoHub</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<nav th:replace="~{fragments/layout :: nav(active='notifications')}"></nav>

<div class="container">
  <section class="section" style="max-width:640px;">
    <div class="section__head">
      <h1>Notifications</h1>
      <form th:action="@{/notifications/mark-all-read}" method="post">
        <button type="submit" class="btn btn-ghost btn-sm">Mark all as read</button>
      </form>
    </div>

    <div class="table-wrap" th:if="${!notifications.isEmpty()}">
      <div th:each="n : ${notifications}"
           style="padding:16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:12px; align-items:flex-start;"
           th:style="${n.read} ? 'opacity:0.55;' : ''">
        <div>
          <p style="margin:0; color: var(--paper); font-size:0.9rem;" th:text="${n.message}">
            Your comment on "Java Tutorial" got a reply.
          </p>
          <span class="comment__meta" th:text="${n.postedAgo}">1 hour ago</span>
        </div>
        <span class="nav__dot" th:if="${!n.read}" aria-hidden="true" style="margin-top:6px; flex-shrink:0;"></span>
      </div>
    </div>

    <div class="empty" th:if="${notifications.isEmpty()}">
      <h3>You're all caught up</h3>
      <p>New activity on your videos, playlists, and comments will show up here.</p>
    </div>
  </section>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
