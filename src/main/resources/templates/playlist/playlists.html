<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Your playlists — VideoHub</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<nav th:replace="~{fragments/layout :: nav(active='playlists')}"></nav>

<div class="container">
  <section class="section">
    <div class="section__head">
      <div>
        <h1>Your playlists</h1>
        <p>Save videos to watch later or group them into collections.</p>
      </div>
      <button class="btn btn-primary" onclick="document.getElementById('createForm').classList.toggle('is-open')">+ New playlist</button>
    </div>

    <form id="createForm" th:action="@{/playlists}" method="post" class="side-card" style="max-width:420px; display:none;">
      <div class="field">
        <label for="name">Playlist name</label>
        <input id="name" name="name" type="text" placeholder="e.g. Watch later, Favourites" required/>
      </div>
      <button type="submit" class="btn btn-primary btn-sm">Create playlist</button>
    </form>

    <div class="grid" th:if="${!playlists.isEmpty()}">
      <a class="card" th:each="p : ${playlists}" th:href="@{'/playlists/' + ${p.id}}">
        <div class="card__thumb"
             th:style="${!#strings.isEmpty(p.thumbnailUrl)} ? |background-image:url(${p.thumbnailUrl});background-size:cover;background-position:center;| : ''">
          <span class="reel-badge" th:text="${p.videoCount} + ' videos'">6 videos</span>
        </div>
        <div class="card__body">
          <h3 class="card__title" th:text="${p.name}">Watch later</h3>
          <div class="card__meta">
            <span th:text="'Updated ' + ${p.updatedAgo}">Updated 3 days ago</span>
          </div>
        </div>
      </a>
    </div>

    <div class="empty" th:if="${playlists.isEmpty()}">
      <h3>No playlists yet</h3>
      <p>Create one to start saving videos you want to watch again.</p>
    </div>
  </section>
</div>

<style>#createForm.is-open{display:block !important;}</style>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
