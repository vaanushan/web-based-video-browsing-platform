<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--/* ============ NAV ============ */-->
<nav th:fragment="nav(active)" class="nav">
  <div class="nav__inner">
    <a href="/" class="nav__brand">
      <span class="nav__brand-mark">Video</span><span class="nav__brand-sub">Hub</span>
    </a>
    <form class="nav__search" action="/search" method="get">
      <input type="text" name="q" placeholder="Search videos, channels, topics&hellip;" aria-label="Search videos"/>
      <button type="submit" aria-label="Search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
    </form>
    <div class="nav__links">
      <!-- Links only visible after login -->
      <a th:if="${currentUser != null}" th:href="@{/}" th:classappend="${active == 'browse'} ? 'is-active'">Home</a>
      <a th:if="${currentUser != null}" th:href="@{/playlists}" th:classappend="${active == 'playlists'} ? 'is-active'">Playlists</a>
      <a th:if="${currentUser != null}" th:href="@{/notifications}" th:classappend="${active == 'notifications'} ? 'is-active'">
        Notifications <span class="nav__dot" aria-hidden="true"></span>
      </a>
      <a th:if="${currentUser != null}" th:href="@{/channel}" th:classappend="${active == 'channel'} ? 'is-active'" class="nav__channel">My Channel</a>
      <a th:if="${currentUser != null}" th:href="@{/upload}" class="nav__cta">Upload</a>
      <!-- Admin link -->
      <a th:href="@{/admin}" th:if="${currentUser != null and currentUser.role.name() == 'ADMIN'}" th:classappend="${active == 'admin'} ? 'is-active'" class="nav__admin">Admin</a>
      <!-- Auth actions -->
      <a th:href="@{/logout}" th:if="${currentUser != null}" class="btn btn-ghost btn-sm">Sign out</a>
      <a th:href="@{/login}" th:if="${currentUser == null}" class="nav__cta">Sign in</a>
    </div>
  </div>
</nav>

<!--/* ============ FOOTER ============ */-->
<footer th:fragment="footer" class="footer">
  <div class="footer__inner">
    <div>
      <span class="nav__brand-mark">Video</span><span class="nav__brand-sub">Hub</span>
      <p>Discover, watch, and share videos from creators around the world.</p>
    </div>
    <div class="footer__meta">
      <p>SE2030 Software Engineering &middot; Group Project</p>
      <p>Built by Asven &middot; Maldeniya &middot; Sandeepani &middot; Amsakan &middot; Pathirana &middot; Vaanushan</p>
    </div>
  </div>
</footer>

</body>
</html>
