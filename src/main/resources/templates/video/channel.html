<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${channelUser.name} + ' — My Channel | VideoHub'">My Channel — VideoHub</title>
  <meta name="description" th:content="'Watch all videos uploaded by ' + ${channelUser.name} + ' on VideoHub.'"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <style>
    /* ── Channel Banner ── */
    .channel-banner {
      background: linear-gradient(135deg, #1d2130 0%, #2c3348 50%, #1a1f2e 100%);
      border-bottom: 1px solid var(--line);
      padding: 48px 0 32px;
      position: relative;
      overflow: hidden;
    }
    .channel-banner::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 80% 60% at 60% 40%, rgba(232,176,75,0.08), transparent 70%);
      pointer-events: none;
    }
    .channel-banner__inner {
      max-width: var(--container); margin: 0 auto; padding: 0 28px;
      display: flex; align-items: center; gap: 28px; flex-wrap: wrap;
    }
    .channel-avatar {
      width: 88px; height: 88px; border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--coral));
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display); font-weight: 700; font-size: 2.2rem; color: var(--ink);
      flex-shrink: 0; border: 3px solid rgba(232,176,75,0.3);
      box-shadow: 0 0 0 6px rgba(232,176,75,0.08);
    }
    .channel-meta { flex: 1; }
    .channel-meta h1 {
      font-size: clamp(1.6rem, 3vw, 2.4rem); margin-bottom: 6px;
      background: linear-gradient(90deg, var(--paper), var(--gold));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .channel-meta__sub { font-size: 0.88rem; color: var(--muted); margin: 0; display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
    .channel-meta__sub span { display: flex; align-items: center; gap: 5px; }
    .channel-meta__sub .role-badge {
      font-family: var(--font-mono); font-size: 0.7rem; padding: 2px 10px;
      border-radius: 999px; border: 1px solid var(--gold-dim); color: var(--gold);
      background: rgba(232,176,75,0.08);
    }
    .channel-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

    /* ── Video count chip ── */
    .vid-count {
      font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted-2);
      background: var(--ink-raised); border: 1px solid var(--line);
      border-radius: 999px; padding: 4px 12px;
    }

    /* ── Channel tabs ── */
    .channel-tabs {
      border-bottom: 1px solid var(--line);
      background: rgba(29,33,48,0.6); backdrop-filter: blur(6px);
      position: sticky; top: 57px; z-index: 30;
    }
    .channel-tabs__inner {
      max-width: var(--container); margin: 0 auto; padding: 0 28px;
      display: flex; gap: 0;
    }
    .channel-tabs a {
      padding: 14px 20px; font-size: 0.88rem; font-weight: 600; color: var(--muted);
      border-bottom: 2px solid transparent; transition: color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .channel-tabs a:hover { color: var(--paper); }
    .channel-tabs a.is-active { color: var(--gold); border-color: var(--gold); }

    /* ── Videos section ── */
    .channel-section { padding: 44px 0 64px; }

    /* ── Empty upload CTA ── */
    .empty-channel {
      text-align: center; padding: 80px 20px;
      border: 1px dashed var(--line); border-radius: var(--radius); max-width: 540px; margin: 0 auto;
    }
    .empty-channel .empty-icon {
      width: 70px; height: 70px; border-radius: 50%;
      background: linear-gradient(135deg, rgba(232,176,75,0.15), rgba(226,102,75,0.1));
      border: 1px solid var(--line);
      display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;
      font-size: 2rem;
    }
    .empty-channel h3 { color: var(--paper); margin-bottom: 8px; }
    .empty-channel p  { color: var(--muted); margin-bottom: 24px; }
  </style>
</head>
<body>

<nav th:replace="~{fragments/layout :: nav(active='channel')}"></nav>

<!-- ===== Channel Banner ===== -->
<div class="channel-banner">
  <div class="channel-banner__inner">
    <!-- Avatar: first letter of name -->
    <div class="channel-avatar" th:text="${#strings.substring(channelUser.name, 0, 1).toUpperCase()}">A</div>

    <div class="channel-meta">
      <h1 th:text="${channelUser.name}">Channel Name</h1>
      <p class="channel-meta__sub">
        <span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          <span th:text="${videos.size()} + ' videos'">0 videos</span>
        </span>
        <span th:text="${channelUser.email}" style="color:var(--muted-2);">email@example.com</span>
        <span class="role-badge" th:text="${channelUser.role}">CONTENT_CREATOR</span>
      </p>
    </div>

    <div class="channel-actions">
      <a th:href="@{/upload}" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Upload Video
      </a>
    </div>
  </div>
</div>

<!-- ===== Channel Tabs ===== -->
<div class="channel-tabs">
  <div class="channel-tabs__inner">
    <a href="#videos" class="is-active">Videos</a>
    <a th:href="@{/playlists}">Playlists</a>
  </div>
</div>

<!-- ===== Videos ===== -->
<section class="channel-section">
  <div class="container">
    <div class="section__head">
      <h2>Uploaded Videos</h2>
      <span class="vid-count" th:text="${videos.size()} + ' total'">0 total</span>
    </div>

    <!-- Video grid -->
    <div class="grid" th:if="${!videos.isEmpty()}" id="videos">
      <a class="card" th:each="v : ${videos}" th:href="@{'/videos/' + ${v.id}}">
        <div class="card__thumb"
             th:style="${!#strings.isEmpty(v.thumbnailUrl)} ? |background-image:url(${v.thumbnailUrl});background-size:cover;background-position:center;| : ''">
          <span class="reel-badge" th:text="${v.duration}">0:00</span>
        </div>
        <div class="card__body">
          <h3 class="card__title" th:text="${v.title}">Video Title</h3>
          <div class="card__meta">
            <span th:text="${v.category}">General</span>
            <span>&middot;</span>
            <span th:text="${v.views} + ' views'">0 views</span>
          </div>
        </div>
      </a>
    </div>

    <!-- Empty state -->
    <div class="empty-channel" th:if="${videos.isEmpty()}" id="videos">
      <div class="empty-icon">🎬</div>
      <h3>No videos yet</h3>
      <p>You haven't uploaded any videos to your channel. Start sharing your content with the world!</p>
      <a th:href="@{/upload}" class="btn btn-primary">Upload your first video</a>
    </div>
  </div>
</section>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
